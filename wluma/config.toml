# Screen brightness follows the ambient light sensor (iio "als", enabled by
# asus-expertbook-linux ish-firmware). wluma learns from your manual adjustments.

# Ambient light only; set capturer = "auto" to also adapt to what's on screen.
[[output.backlight]]
name = "eDP-1"
path = "/sys/class/backlight/intel_backlight"
capturer = "none"

# The keyboard backlight is already driven by kbd-backlight-auto.service
# (asus-expertbook-linux); don't let two daemons fight over it.
[[keyboard]]
name = "keyboard"
path = "/sys/class/leds/asus::kbd_backlight"
enabled = false
