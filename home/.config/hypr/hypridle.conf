general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

listener {
    timeout = 480
    on-timeout = [ -e ~/.local/state/stay-awake ] || hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

listener {
    timeout = 600
    on-timeout = [ -e ~/.local/state/stay-awake ] || systemctl suspend
}
