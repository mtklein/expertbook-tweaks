general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = qs ipc call lock blank
    inhibit_sleep = 3
    after_sleep_cmd = qs ipc call lock reveal ; hyprctl dispatch 'hl.dsp.dpms({action="on"})' ; echo screen | socat -t 1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/ambient-display.sock
}

listener {
    timeout = 480
    on-timeout = [ -e ~/.local/state/stay-awake ] || { hyprctl dispatch 'hl.dsp.dpms({action="off"})' ; echo screen | socat -t 1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/ambient-display.sock; }
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})' ; echo screen | socat -t 1 - UNIX-CONNECT:$XDG_RUNTIME_DIR/ambient-display.sock
}

listener {
    timeout = 600
    on-timeout = [ -e ~/.local/state/stay-awake ] || systemctl suspend
}
