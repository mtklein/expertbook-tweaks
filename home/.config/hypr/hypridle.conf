# Idle policy: display off at 8 min, suspend at 10 min. Omarchy locks on every suspend
# (omarchy-sleep-lock.service), so there is no separate lock step; Omarchy's own idle
# timers are off (~/.config/omarchy/shell.json: idle.screensaver = 0, idle.lock = 0).
# Video playback etc. holds both off via Wayland idle inhibitors, and both respect
# Omarchy's "stay awake" toggle (a state file, not an idle inhibitor).

general {
    inhibit_sleep = 0   # no before_sleep_cmd, so never delay suspend
    # Hyprland's config is Lua here, so dispatches are Lua expressions.
    # Then raise brightness to at least 15% (~8 nits) so the lock screen is visible.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'; ~/.local/bin/brightness-wake-floor
}

listener {
    timeout = 480
    on-timeout = [ -e ~/.local/state/omarchy/indicators/stay-awake ] || hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

listener {
    timeout = 600
    on-timeout = [ -e ~/.local/state/omarchy/indicators/stay-awake ] || systemctl suspend
}
