[main]
term=xterm-256color
font=DejaVuSansM Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return

[bell]
system=no
urgent=no
notify=no
visual=no

[colors-dark]
foreground=1d1d1f
background=ffffff
blur=yes
selection-foreground=1d1d1f
selection-background=b5d5ff
cursor=ffffff 1d1d1f

regular0=1d1d1f
regular1=c4261d
regular2=1e7b34
regular3=8f6400
regular4=1f5fc4
regular5=8a3fae
regular6=0f6f80
regular7=6e6e73

bright0=57575c
bright1=e0352b
bright2=2a9a43
bright3=b07d00
bright4=3875d7
bright5=a557c9
bright6=1a8ca0
bright7=000000
