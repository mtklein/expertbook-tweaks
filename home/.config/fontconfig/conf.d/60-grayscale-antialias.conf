<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Greyscale font antialiasing instead of subpixel (LCD) antialiasing.

  The internal OLED isn't an RGB-stripe panel, and at ~200 dpi subpixel AA
  buys nothing. Worse, in HDR it shows up as stray super-bright pixels on
  glyph edges: per-channel LCD coverage can exceed the pixel's alpha, which
  is clipped invisibly in SDR but renders brighter than white once Hyprland
  maps it into the HDR range. Qt (the Omarchy shell/bar) otherwise takes the
  subpixel layout the compositor reports for the output.
-->
<fontconfig>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
