<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tiger theme: the default interface/sans font is Luxi Sans, the free sibling
     of Lucida Grande (both by Bigelow & Holmes). Delete this file to go back.

     Only requests whose FIRST choice is a generic sans or system UI font are
     changed: Omarchy's 50-omarchy.conf has already rewritten "sans-serif" to
     "Liberation Sans" by the time this runs, and every pattern carries generic
     fallbacks, so testing any position would hijack named fonts (foot's
     monospace font, for one). -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="first"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Luxi Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Luxi Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>-apple-system</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Luxi Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Luxi Sans</string></edit>
  </match>
</fontconfig>
