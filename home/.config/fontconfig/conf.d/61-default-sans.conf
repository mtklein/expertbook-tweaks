<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
