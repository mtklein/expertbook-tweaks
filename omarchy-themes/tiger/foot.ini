# Tiger's terminal: Terminal.app's white page, re-tuned so every ANSI colour is
# legible on it. Omarchy's template uses the background as "black" and the
# foreground as "white" (right for dark themes, invisible black text on light
# ones); here black is ink and white is a mid grey.
[colors-dark]
foreground=1d1d1f
background=ffffff
blur=yes
selection-foreground=1d1d1f
selection-background=b5d5ff
cursor=ffffff 1d1d1f

regular0=1d1d1f
regular1=c4261d
regular2=1e7b34
regular3=8f6400
regular4=1f5fc4
regular5=8a3fae
regular6=0f6f80
regular7=6e6e73

bright0=57575c
bright1=e0352b
bright2=2a9a43
bright3=b07d00
bright4=3875d7
bright5=a557c9
bright6=1a8ca0
bright7=000000
