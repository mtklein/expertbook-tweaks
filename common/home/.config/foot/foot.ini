[main]
term=xterm-256color
font=DejaVuSansM Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return

[bell]
system=no
urgent=no
notify=no
visual=no

[colors-dark]
foreground=d8d8d8
background=161618
blur=yes
selection-foreground=ffffff
selection-background=2f4a73
cursor=161618 d8d8d8

regular0=3e3e43
regular1=ff6961
regular2=5fcf6a
regular3=e6c14a
regular4=6aa8ff
regular5=d48cf2
regular6=4fc9d9
regular7=b0b0b6

bright0=8e8e93
bright1=ff9085
bright2=86ee93
bright3=ffdc6b
bright4=94c0ff
bright5=e6a9ff
bright6=7ae6f3
bright7=ffffff
