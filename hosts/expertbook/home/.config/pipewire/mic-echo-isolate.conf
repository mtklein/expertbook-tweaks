context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            aec.args = {
                webrtc.high_pass_filter  = true
                webrtc.noise_suppression = false
                webrtc.gain_control      = true
            }
            capture.props = {
                node.name     = "mic.echo.capture"
                node.passive  = true
                target.object = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Mic__source"
            }
            source.props = {
                node.name        = "mic.echo"
                node.description = "Microphone, echo cancelled only"
            }
            sink.props = {
                node.name    = "mic.echo.reference"
                node.passive = true
            }
        }
    }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Microphone, echo cancelled and voice isolated"
            media.name       = "Microphone, echo cancelled and voice isolated"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = "DeepFilter Mono"
                        plugin = /usr/lib/ladspa/libdeep_filter_ladspa.so
                        label  = deep_filter_mono
                        control = {
                            "Attenuation Limit (dB)" 100
                        }
                    }
                ]
            }
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name     = "mic.isolate.capture"
                node.passive  = true
                target.object = "mic.echo"
            }
            playback.props = {
                node.name   = "mic.processed"
                media.class = Audio/Source
            }
        }
    }
]
