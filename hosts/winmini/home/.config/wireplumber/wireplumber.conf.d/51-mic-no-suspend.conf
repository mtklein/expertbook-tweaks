# Keep the microphone awake so the start of dictation isn't clipped
# while the device wakes from idle suspend.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
