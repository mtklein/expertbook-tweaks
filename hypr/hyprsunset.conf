# hyprsunset starts neutral; ~/expertbook-tweaks/bin/ambient-white (user service)
# sets the actual white point from the ambient light sensor over hyprsunset's IPC.
# Without a profile hyprsunset would apply its default 6000 K tint at startup.
# (It also re-applies this profile daily at 07:00; ambient-white re-sends every 30 s.)
profile {
    time = 07:00
    identity = true
}
