# Screen-off stage that Omarchy's idle settings don't have.
# Omarchy's shell still owns locking (~/.config/omarchy/shell.json: idle.lock = 540,
# idle.screensaver = 0), so: display off at 8 min idle, lock at 9 min.
# Video playback etc. holds this off via Wayland idle inhibitors, like Omarchy's own idle.

general {
    inhibit_sleep = 0   # no before_sleep_cmd, so never delay suspend
    # Hyprland's config is Lua here, so dispatches are Lua expressions.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}

listener {
    timeout = 480
    # Respect Omarchy's "stay awake" toggle (a state file, not an idle inhibitor).
    on-timeout = [ -e ~/.local/state/omarchy/indicators/stay-awake ] || hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
